{% extends "base.html" %}
{% block title %}登入 - 投稿審查系統{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>登入</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>帳號
      <input name="username" value="{{ username or '' }}" required autofocus>
    </label>
    <label>密碼
      <input name="password" type="password" required>
    </label>
    <button class="primary">登入</button>
  </form>
  <p class="hint">測試帳號：author1、author2（作者）、editor1（編輯），密碼 123456</p>
</div>
{% endblock %}
